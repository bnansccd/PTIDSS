      tags: [intel]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ruleName, matchTags, importance]
              properties:
                ruleName: { type: string }
                matchTags: { type: array, items: { type: string } }
                importance: { type: string, enum: [high, medium, low] }
                targets: { type: array, items: { type: string }, description: 角色/用户编码 }
