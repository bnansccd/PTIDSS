    RollingPlan:
      type: object
      properties:
        planId: { type: string }
        tradeDate: { type: string, format: date }
        scenario: { type: string }
        expectedRevenue: { type: number }
        riskMetrics: { type: object }
        status: { type: string }
        createdBy: { type: string }
    TradeResult:
      type: object
      properties:
        declarationId: { type: string }
        matchedVolume: { type: number }
        matchedPrice: { type: number }
        matchedCurve: { type: array, items: { type: number } }
        settlementImpact: { type: object }
    ReconcileResult:
      type: object
      properties:
        reconcileId: { type: string }
