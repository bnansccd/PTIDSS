openapi: 3.0.3
info:
  title: 电力交易智能辅助决策系统 API
  description: |
    配套开发基线 5.5 API 目录总表。统一响应封装 ApiResponse；分页用 PageResult；
    鉴权 JWT Bearer；错误码分段见 README 第 4 条。所有路径省略网关前缀 /api/v1。
  version: 1.0.0
  license:
    name: 项目内部使用
    url: https://api.ptidss.example.com/license
  contact:
    name: PTIDSS 架构组
servers:
  - url: https://api.ptidss.example.com/api/v1
    description: 生产（示例域名）
  - url: https://api-test.ptidss.example.com/api/v1
    description: 测试
tags:
  - { name: auth, description: 认证授权 }
  - { name: policy, description: 政策服务 }
  - { name: market, description: 行情服务 }
  - { name: forecast, description: 预测服务 }
  - { name: decision, description: 决策编排 }
  - { name: optimize, description: 联合优化/回测 }
  - { name: trade, description: 交易服务 }
  - { name: settlement, description: 结算服务 }
  - { name: ocr, description: 单据识别 }
  - { name: review, description: 复盘服务 }
  - { name: assessment, description: 成效考核 }
  - { name: report, description: 报表服务 }
  - { name: data, description: 数据管理 }
  - { name: message, description: 消息服务 }
  - { name: flow, description: 流程引擎 }
  - { name: model, description: 模型平台 }
  - { name: intel, description: 情报中心 }
security:
  - bearerAuth: []
paths:
  # ==================== auth ====================
  /auth/captcha:
    get:
      operationId: getAuthCaptcha
      summary: 获取验证码（图片 Base64 + 键）
      tags: [auth]
      security: []
      responses:
        '200':
          description: 验证码
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - properties:
                      data:
                        type: object
                        required: [captchaKey, image]
                        properties:
                          captchaKey: { type: string, description: 登录时回传 }
                          image: { type: string, description: 'data:image/png;base64, 前缀' }
        '4XX': { $ref: '#/components/responses/BizError' }
  /auth/login:
    post:
      operationId: postAuthLogin
      summary: 账号密码登录（或 SSO 回调）
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: trader01 }
                password: { type: string, format: password }
                captcha: { type: string, description: 验证码（连续失败后必填） }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - properties:
                      data: { $ref: '#/components/schemas/LoginResult' }
        '4XX': { $ref: '#/components/responses/BizError' }
        '5XX': { $ref: '#/components/responses/ServerError' }
  /auth/refresh:
    post:
      operationId: postAuthRefresh
      summary: 刷新 Token（续期换新）
      description: >
        refreshToken 传当前有效 accessToken（JWT 自校验 + 服务端会话缓存校验）；
        剩余有效期不足阈值（默认 10min）时自动续期并重新签发新令牌；
        旧令牌宽限期内仍可用（滑动续期语义）。响应结构与 /auth/login 一致。
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 新 Token
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - properties:
                      data:
                        type: object
                        properties:
                          accessToken: { type: string }
                          expiresIn: { type: integer, example: 7200 }
        '4XX': { $ref: '#/components/responses/BizError' }
  /auth/current:
    get:
      operationId: getAuthCurrent
      summary: 当前用户信息与权限
      tags: [auth]
      responses:
        '200':
          description: 用户信息
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - properties:
                      data: { $ref: '#/components/schemas/CurrentUser' }
        '4XX': { $ref: '#/components/responses/BizError' }
  /auth/logout:
    post:
      operationId: postAuthLogout
      summary: 登出（吊销 Token）
      tags: [auth]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  # ==================== admin（系统管理，V1.1 落地同步） ====================
  /admin/regions:
    get:
      operationId: getAdminRegions
      summary: 区域列表（多省配置化，评审决议⑤）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [enabled, disabled, pending] } }
      responses:
        '200':
          description: 区域列表
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SysRegion' }
        '4XX': { $ref: '#/components/responses/BizError' }
    post:
      operationId: postAdminRegions
      summary: 新建区域
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SysRegion' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '4XX': { $ref: '#/components/responses/BizError' }
    put:
      operationId: putAdminRegions
      summary: 更新区域
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SysRegion' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '4XX': { $ref: '#/components/responses/BizError' }
  /admin/regions/{id}:
    get:
      operationId: getAdminRegionsDetail
      summary: 区域详情
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 区域
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - properties: { data: { $ref: '#/components/schemas/SysRegion' } }
        '4XX': { $ref: '#/components/responses/BizError' }
    delete:
      operationId: deleteAdminRegions
      summary: 删除区域（软删）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '4XX': { $ref: '#/components/responses/BizError' }
  /admin/users:
    get:
      operationId: getAdminUsers
      summary: 用户分页
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/PageParam' }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, disabled, locked] } }
      responses:
        '200':
          description: 分页
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - properties: { data: { $ref: '#/components/schemas/PageResult' } }
        '4XX': { $ref: '#/components/responses/BizError' }
    post:
      operationId: postAdminUsers
      summary: 新建用户
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, roleIds]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                displayName: { type: string }
                roleIds: { type: array, items: { type: integer } }
                regionCodes: { type: array, items: { type: string } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '4XX': { $ref: '#/components/responses/BizError' }
    put:
      operationId: putAdminUsers
      summary: 更新用户
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string, description: 雪花 ID（JSON 序列化为字符串） }
                displayName: { type: string }
                roleIds: { type: array, items: { type: integer } }
                regionCodes: { type: array, items: { type: string } }
                status: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '4XX': { $ref: '#/components/responses/BizError' }
  /admin/users/{id}:
    get:
      operationId: getAdminUsersDetail
      summary: 用户详情
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 用户
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - properties: { data: { $ref: '#/components/schemas/SysUser' } }
        '4XX': { $ref: '#/components/responses/BizError' }
    delete:
      operationId: deleteAdminUsers
      summary: 删除用户（软删）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '4XX': { $ref: '#/components/responses/BizError' }
  /admin/users/{id}/regions:
    get:
      operationId: getAdminUsersRegions
      summary: 用户已授权区域
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 区域编码列表
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - properties:
                      data: { type: array, items: { type: string } }
        '4XX': { $ref: '#/components/responses/BizError' }
  /admin/users/{id}/password:
    put:
      operationId: putAdminUsersPassword
      summary: 重置密码
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '4XX': { $ref: '#/components/responses/BizError' }
  /admin/roles:
    get:
      operationId: getAdminRoles
      summary: 角色列表（固定 7 类编码）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
      responses:
        '200':
          description: 角色列表
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SysRole' }
        '4XX': { $ref: '#/components/responses/BizError' }
    post:
      operationId: postAdminRoles
      summary: 新建角色
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SysRole' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '4XX': { $ref: '#/components/responses/BizError' }
    put:
      operationId: putAdminRoles
      summary: 更新角色
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SysRole' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '4XX': { $ref: '#/components/responses/BizError' }
  /admin/roles/{id}:
    get:
      operationId: getAdminRolesDetail
      summary: 角色详情
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 角色
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - properties: { data: { $ref: '#/components/schemas/SysRole' } }
        '4XX': { $ref: '#/components/responses/BizError' }
    delete:
      operationId: deleteAdminRoles
      summary: 删除角色（软删）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '4XX': { $ref: '#/components/responses/BizError' }
  /admin/roles/{id}/permissions:
    get:
      operationId: getAdminRolesPermissions
      summary: 角色已授权限
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 权限 ID 列表
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - properties:
                      data: { type: array, items: { type: integer } }
        '4XX': { $ref: '#/components/responses/BizError' }
    put:
      operationId: putAdminRolesPermissions
      summary: 保存角色权限（全量覆盖）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permissionIds: { type: array, items: { type: integer } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '4XX': { $ref: '#/components/responses/BizError' }
  /admin/permissions:
    get:
      operationId: getAdminPermissions
      summary: 权限列表（三级权限：menu/api/data）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: resourceType, in: query, schema: { type: string, enum: [menu, api, data] } }
      responses:
        '200':
          description: 权限列表
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SysPermission' }
        '4XX': { $ref: '#/components/responses/BizError' }
    post:
      operationId: postAdminPermissions
      summary: 新建权限
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SysPermission' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '4XX': { $ref: '#/components/responses/BizError' }
    put:
      operationId: putAdminPermissions
      summary: 更新权限
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SysPermission' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '4XX': { $ref: '#/components/responses/BizError' }
  /admin/permissions/{id}:
    delete:
      operationId: deleteAdminPermissions
      summary: 删除权限（软删）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '4XX': { $ref: '#/components/responses/BizError' }
  /admin/logs:
    get:
      operationId: getAdminLogs
      summary: 审计日志分页（等保三级）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/PageParam' }
        - { name: action, in: query, schema: { type: string } }
        - { name: username, in: query, schema: { type: string } }
        - { name: regionCode, in: query, schema: { type: string } }
        - { name: result, in: query, schema: { type: string, enum: [success, fail] } }
      responses:
        '200':
          description: 分页
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - properties: { data: { $ref: '#/components/schemas/PageResult' } }
        '4XX': { $ref: '#/components/responses/BizError' }
  /admin/logs/{id}:
    get:
      operationId: getAdminLogsDetail
      summary: 审计日志详情（前后快照）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 详情
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - properties: { data: { $ref: '#/components/schemas/AuditLog' } }
        '4XX': { $ref: '#/components/responses/BizError' }

  # ==================== policy ====================
  /policy/list:
    get:
      operationId: getPolicyList
      summary: 政策文件分页列表（多维筛选）
      tags: [policy]
      parameters:
        - { $ref: '#/components/parameters/PageParam' }
        - { name: category, in: query, schema: { type: string, enum: [national, regional, provincial] } }
        - { name: keyword, in: query, schema: { type: string, description: 标题模糊搜索 } }
        - { name: status, in: query, schema: { type: string, enum: [draft, published, expired] } }
      responses:
        '200':
          description: 列表
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - properties: { data: { $ref: '#/components/schemas/PageResult' } }
        '4XX': { $ref: '#/components/responses/BizError' }
  /policy/{id}:
    get:
      operationId: getPolicy
      summary: 政策详情（含附件、多版本）
      tags: [policy]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 详情
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - properties: { data: { $ref: '#/components/schemas/PolicyDetail' } }
        '4XX': { $ref: '#/components/responses/BizError' }
  /policy/parse:
    post:
      operationId: postPolicyParse
      summary: 解析政策文档（LLM 抽取条款→结构化规则候选）
      tags: [policy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policyId]
              properties:
                policyId: { type: integer }
                reparse: { type: boolean, default: false, description: 是否强制重解析 }
      responses:
        '200':
          description: 解析任务结果（异步任务返回 taskId 轮询）
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - properties:
                      data:
                        type: object
                        properties:
                          taskId: { type: string }
                          articlesParsed: { type: integer, example: 32 }
                          ruleCandidates: { type: integer, example: 5 }
                          avgConfidence: { type: number, example: 0.91 }
        '4XX': { $ref: '#/components/responses/BizError' }
  /policy/{id}/brief:
    get:
      operationId: getPolicyBrief
      summary: 政策研判简报（PDF/Word 导出）
      tags: [policy]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 文件（application/pdf 或 octet-stream）
          content:
            application/pdf: {}
            application/octet-stream: {}
        '4XX': { $ref: '#/components/responses/BizError' }

  # ==================== market ====================
  /market/price/spot:
    get:
      operationId: getMarketPriceSpot
      summary: 现货价格时序查询（96 点/区间）
      tags: [market]
      parameters:
        - { name: marketType, in: query, required: true, schema: { type: string, enum: [intra_province, inter_province] } }
        - { name: stage, in: query, required: true, schema: { type: string, enum: [day_ahead, real_time] } }
        - { name: startAt, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$', description: '格式 yyyy-MM-dd HH:mm:ss' } }
