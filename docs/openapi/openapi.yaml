  /intel/push-rules/execute:
    post:
      operationId: postIntelPushRulesExecute
      summary: 手动触发推送规则执行（情报→消息中心联动）
      description: >
        执行全部 active 推送规则：匹配未推送情报（标签交集 × 重要度一致）→ 按目标角色
        派发个人消息（msg_type=intel_push）→ 更新情报推送状态。另有服务端定时 30s 自动执行兜底。
      tags: [intel]
      responses:
        '200':
          description: 推送执行完成
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - properties:
                      data:
                        type: object
                        properties:
                          matchedNews: { type: integer, description: 匹配并推送的情报条数 }
                          pushedMessages: { type: integer, description: 派发的个人消息条数 }
        '4XX': { $ref: '#/components/responses/BizError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageParam:
      name: pageNo
      in: query
      description: 分页参数（pageNo/pageSize，对齐后端 @RequestParam 实现）
      schema:
        type: object
        properties:
          pageNo: { type: integer, minimum: 1, default: 1 }
          pageSize: { type: integer, maximum: 200, default: 20 }
  responses:
    BizError:
      description: 业务错误（错误码分段见 README）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServerError:
      description: 服务端错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ApiResponse:
      type: object
      required: [code, message, data, traceId]
      properties:
        code: { type: integer, description: 0 成功；非 0 见错误码分段表, example: 0 }
        message: { type: string, example: success }
        data: { type: object, nullable: true, description: 业务数据（随接口变化） }
        traceId: { type: string, description: 全链路追踪 ID }
    ErrorResponse:
      type: object
      properties:
        code: { type: integer, example: 14001 }
        message: { type: string }
        traceId: { type: string }
        detail: { type: object, nullable: true, description: 参数错误明细 }
    PageResult:
      type: object
      properties:
        list: { type: array, items: { type: object } }
        pageNo: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    SysRegion:
      type: object
      properties:
        id: { type: string, description: 雪花 ID（JSON 序列化为字符串） }
        regionCode: { type: string }
        regionName: { type: string }
        status: { type: string, enum: [enabled, disabled, pending] }
        launchOrder: { type: integer }
    SysUser:
      type: object
      properties:
        id: { type: string, description: 雪花 ID（JSON 序列化为字符串） }
        username: { type: string }
        displayName: { type: string }
        status: { type: string }
        roleIds: { type: array, items: { type: integer } }
        regionCodes: { type: array, items: { type: string } }
    SysRole:
      type: object
      description: 角色（编码固定 7 类，与 PRD 七类角色对齐；新建角色受服务端 DDL CHECK 约束，仅可更新 description/status）
      properties:
        id: { type: string, description: 雪花 ID（JSON 序列化为字符串） }
        roleName: { type: string }
        roleCode:
          type: string
          enum: [trader, analyst, settlement, admin, manager, compliance, mobile]
        description: { type: string }
        status: { type: string }
    SysPermission:
      type: object
      properties:
        id: { type: string, description: 雪花 ID（JSON 序列化为字符串） }
        permName: { type: string }
        permCode: { type: string }
        resourceType: { type: string, enum: [menu, api, data] }
        resourcePattern: { type: string }
    AuditLog:
      type: object
      properties:
        id: { type: string, description: 雪花 ID（JSON 序列化为字符串） }
        traceId: { type: string }
        userId: { type: integer }
        username: { type: string }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        beforeSnapshot: { type: object }
        afterSnapshot: { type: object }
        ip: { type: string }
        result: { type: string, enum: [success, fail] }
        regionCode: { type: string }
        createdAt: { type: string, format: date-time }
