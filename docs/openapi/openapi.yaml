        orgCode: { type: string }
    PolicyDetail:
      type: object
      properties:
        id: { type: string, description: 雪花 ID（JSON 序列化为字符串） }
        title: { type: string }
        issuingBody: { type: string }
        category: { type: string }
        tags: { type: array, items: { type: string } }
        fileUrl: { type: string }
        effectiveDate: { type: string, format: date }
        articles: { type: array, items: { type: object }, description: 解析条款（置信度/人工确认状态） }
    PricePoint:
      type: object
      properties:
        ts: { type: string, format: date-time }
        price: { type: number }
        volume: { type: number }
        stage: { type: string }
    ForecastPoint:
      type: object
      properties:
        pointTime: { type: string, format: date-time }
        value: { type: number }
        lowerBound: { type: number }
        upperBound: { type: number }
        confidence: { type: number }
    ModelInfo:
      type: object
      properties:
        modelCode: { type: string }
        modelName: { type: string }
        version: { type: string }
        framework: { type: string }
        metrics: { type: object }
        status: { type: string, enum: [training, evaluating, online, rolled_back] }
    DecisionSession:
      type: object
      properties:
        sessionId: { type: string }
        sessionType: { type: string }
        tradeDate: { type: string, format: date }
        status: { type: string }
        finalStrategy: { type: object }
        agents: { type: array, items: { type: string } }
        humanReviewStatus: { type: string }
        evidenceSummary: { type: object }
    AgentRun:
      type: object
      properties:
        agentCode: { type: string }
        inputSnapshot: { type: object }
        output: { type: object }
