      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 7200 }
    CurrentUser:
      type: object
      properties:
        userId: { type: integer }
        username: { type: string }
        displayName: { type: string }
