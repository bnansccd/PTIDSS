# ============================================================
# PTIDSS 生产环境配置模板（V1.7）
# 启动：java -jar ptidss-server.jar --spring.profiles.active=prod
# 所有敏感/环境相关项均支持环境变量覆盖（见 deploy/start.sh 与部署文档）
# ============================================================
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    # 云 RDS/自建 PostgreSQL：通过环境变量覆盖连接信息
    #   DB_SSLMODE：云 RDS 通常强制 SSL，阿里云/腾讯云/AWS 用 require；需校验证书用 verify-ca/verify-full（附 sslrootcert）
    #   自建内网 pgsql 保持 disable 即可
    url: "jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ptidss}?sslmode=${DB_SSLMODE:disable}&connectTimeout=${DB_CONNECT_TIMEOUT:10}&socketTimeout=${DB_SOCKET_TIMEOUT:60}"
    username: ${DB_USER:ptidss}
    password: ${DB_PASSWORD:ptidss}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:4}
      connection-init-sql: SET app.region_code = ''
      connection-timeout: 10000
      # 云网络环境建议：连接空闲 30 分钟自动回收 + 60 秒保活探测，避免被云防火墙/代理静默掐断
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
      keepalive-time: ${DB_KEEPALIVE_TIME:60000}
      validation-timeout: 3000

logging:
  level:
    root: info
    com.ptidss: info
  file:
    name: ${LOG_FILE:logs/ptidss.log}
    max-size: 100MB
    max-history: 30

ptidss:
  # 令牌密钥（生产必须通过环境变量 TOKEN_SECRET 覆盖为随机强密钥）
  token:
    secret: ${TOKEN_SECRET:ptidss-jwt-secret-key-2026-change-me-in-production}
    expire-minutes: ${TOKEN_EXPIRE_MINUTES:120}
    refresh-threshold-minutes: ${TOKEN_REFRESH_THRESHOLD_MINUTES:10}
  # 初始账号密码初始化（仅 PLACEHOLDER:APP_INIT 占位用户首次启动生效）
  init:
    default-password: ${INIT_DEFAULT_PASSWORD:Ptidss@2026}
  # 生产开启验证码
  captcha:
    enabled: ${CAPTCHA_ENABLED:true}
  # 本地文件存储根目录（政策原文/算法包等上传文件落盘位置；云部署建议挂载持久卷/对象存储网关目录）
  storage:
    path: ${STORAGE_PATH:./data/ptidss}
  # LLM 推理网关：开启后 endpoint+apiKeyRef 就绪的模型走 OpenAI 兼容真实调用
  # 密钥经环境变量 LLM_API_KEY_<REF> 注入（如 LLM_API_KEY_DEEPSEEK），生产勿写入配置文件
  llm:
    gateway-enabled: ${LLM_GATEWAY_ENABLED:true}
  # 连接参数字段级加密（AES-128-CBC）：密钥派生种子，生产必须经 CONFIG_SECRET_KEY 覆盖为独立随机串
  security:
    config-secret-key: ${CONFIG_SECRET_KEY:ptidss-config-secret-key-2026-dev-change-in-production}
    # 跨域白名单（逗号分隔；等保边界防护：生产必须配置为实际前端域名，禁止保留 *）
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  # 登录失败锁定（等保 8.1.4.1 身份鉴别）：连续失败次数限制 + 临时锁定
  login:
    fail-max: ${LOGIN_FAIL_MAX:5}
    fail-lock-minutes: ${LOGIN_FAIL_LOCK_MINUTES:10}
