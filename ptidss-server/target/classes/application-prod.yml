# ============================================================
# PTIDSS 生产环境配置模板（V1.7）
# 启动：java -jar ptidss-server.jar --spring.profiles.active=prod
# 所有敏感/环境相关项均支持环境变量覆盖（见 deploy/start.sh 与部署文档）
# ============================================================
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ptidss}
    username: ${DB_USER:ptidss}
    password: ${DB_PASSWORD:ptidss}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:4}
      connection-init-sql: SET app.region_code = ''
      connection-timeout: 10000

logging:
  level:
    root: info
    com.ptidss: info
  file:
    name: ${LOG_FILE:logs/ptidss.log}
    max-size: 100MB
    max-history: 30

ptidss:
  # 令牌密钥（生产必须通过环境变量 TOKEN_SECRET 覆盖为随机强密钥）
  token:
    secret: ${TOKEN_SECRET:ptidss-jwt-secret-key-2026-change-me-in-production}
    expire-minutes: ${TOKEN_EXPIRE_MINUTES:120}
    refresh-threshold-minutes: ${TOKEN_REFRESH_THRESHOLD_MINUTES:10}
  # 初始账号密码初始化（仅 PLACEHOLDER:APP_INIT 占位用户首次启动生效）
  init:
    default-password: ${INIT_DEFAULT_PASSWORD:Ptidss@2026}
  # 生产开启验证码
  captcha:
    enabled: ${CAPTCHA_ENABLED:true}
