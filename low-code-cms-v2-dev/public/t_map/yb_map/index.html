        .amap-info-sharp{

        .amap-info-sharp {

            justify-content: center;

        }

        .top-box-label{

    // 添加海量数据点
    function addMakers(positions){
        // 创建 AMap.LabelsLayer 图层
         layer1 = new AMap.LabelsLayer({
            zooms: [3, 20],
            zIndex: 1000,
            collision: false
        });

        // 将图层添加到地图
        map.add(layer1);

        let markers = [];
        //  let positions = Positions.slice(0, 3E4);


        let icon = {
            type: 'image',
            image: './imgs/充电场站.png',
            size: [26, 31],
            anchor: 'bottom-center',
        };

        for (let i = 0; i < positions.length; i++) {
            let curPosition = positions[i];
            let curData = {
                position: curPosition,
                icon
            };

            let labelMarker = new AMap.LabelMarker(curData);

            markers.push(labelMarker);

            // 给marker绑定事件
            labelMarker.on('click', function (e) {
                // console.log(e)
                let position = e.data.data && e.data.data.position;

                if (position) {

                      createInfoWindow({lng:position[0],lat:position[1]});
                }
            });
        }

        // 一次性将海量点添加到图层
        layer1.add(markers);
    }
