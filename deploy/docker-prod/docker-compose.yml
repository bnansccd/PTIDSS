# ============================================================
# PTIDSS 生产容器化部署（V3.2，自包含一键部署）
# 三服务：postgres(18) + ptidss-server + nginx(前端静态 + 反代)
# 用法（生产主机）：
#   1. 拷贝本目录（deploy/docker-prod）到生产主机任意位置
#   2. cp .env.example .env 并修改（TOKEN_SECRET/DB_PASSWORD 必改）
#   3. docker compose up -d --build
#   4. 浏览器访问 http://<主机IP>:${FRONT_PORT:-80}
# 数据持久化：pgdata(数据库)/ptidss-data(上传文件)/ptidss-logs(日志)
# 说明：02_tdengine_schema.sql 由 TDengine 侧单独执行，不在此编排内
# ============================================================
services:
  postgres:
    image: postgres:18
    container_name: ptidss-postgres
    environment:
      POSTGRES_DB: ptidss
      POSTGRES_USER: ptidss
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ptidss}
    volumes:
      # postgres 18+ 要求挂载 /var/lib/postgresql（数据落于其 data 子目录，支持 pg_upgrade）
      - pgdata:/var/lib/postgresql
      # 首次启动自动执行基线 DDL 01~18（幂等；已有数据卷不重复执行）
      - ./init-db.sh:/docker-entrypoint-initdb.d/00-init-db.sh:ro
      - ./ddl:/docker-entrypoint-initdb.d-src:ro
    ports:
      - "127.0.0.1:5432:5432"   # 仅宿主机可见；云环境可不映射（容器网络内互访）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptidss -d ptidss"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ptidss-server:
    build:
      context: ./server
    image: ptidss-server:v3.2
    container_name: ptidss-server
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ptidss
      DB_USER: ptidss
      DB_PASSWORD: ${DB_PASSWORD:-ptidss}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      # 生产必须通过 .env 覆盖为随机强密钥
      TOKEN_SECRET: ${TOKEN_SECRET:-ptidss-jwt-secret-key-2026-change-me-in-production}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-true}
      # 等保：生产配置为实际前端域名白名单，禁止保留 *
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      LOG_FILE: /app/logs/ptidss.log
    volumes:
      - ptidss-data:/app/data      # 上传文件持久化（政策原文/算法包等）
      - ptidss-logs:/app/logs      # 后端日志持久化
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:9080:9080"      # 仅宿主机调试；对外统一走 nginx 80
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: ptidss-nginx
    volumes:
      - ./nginx/ptidss.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/opt/ptidss/frontend/dist:ro
    ports:
      - "${FRONT_PORT:-80}:80"     # 前端对外唯一端口（默认 80；可改 8080 等）
    depends_on:
      - ptidss-server
    restart: unless-stopped

volumes:
  pgdata:
  ptidss-data:
  ptidss-logs:
