# ============================================================
# PTIDSS 容器化部署（V2.5，旧版可选方案）
# ⚠️ 生产部署请使用自包含一键方案：deploy/docker-prod/
#    （jar/dist/ddl 全部内置，拷贝目录 → docker compose up -d --build 即可）
# 本编排依赖仓库布局（docs/ddl、frontend/dist、ptidss-server/target），
# 仅供仓库内快速体验；三服务：postgres(18) + ptidss-server + nginx
# 前置：./build.sh 产出 ptidss-server/target/*.jar 与 frontend/dist
# 使用：cd deploy/docker && docker compose up -d --build
# 数据持久化：named volume pgdata（容器删除不丢数据）
# 说明：TDengine 时序库不在此编排内。
# ============================================================
services:
  postgres:
    image: postgres:18
    container_name: ptidss-postgres
    environment:
      POSTGRES_DB: ptidss
      POSTGRES_USER: ptidss
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ptidss}
    volumes:
      # postgres 18+ 要求挂载 /var/lib/postgresql（数据落于其 data 子目录）
      - pgdata:/var/lib/postgresql
      # 初始化包装：执行 docs/ddl 01~15（排除 02 TDengine 时序 脚本），首次启动自动执行
      - ./init-db.sh:/docker-entrypoint-initdb.d/00-init-db.sh:ro
      - ../../docs/ddl:/docker-entrypoint-initdb.d-src:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptidss -d ptidss"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ptidss-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
    container_name: ptidss-server
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ptidss
      DB_USER: ptidss
      DB_PASSWORD: ${DB_PASSWORD:-ptidss}
      TOKEN_SECRET: ${TOKEN_SECRET:-ptidss-jwt-secret-key-2026-change-me-in-production}
      CAPTCHA_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:9080:9080"
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: ptidss-nginx
    volumes:
      - ./ptidss.conf.container:/etc/nginx/conf.d/default.conf:ro
      - ../../frontend/dist:/opt/ptidss/frontend/dist:ro
    ports:
      - "${FRONT_PORT:-80}:80"
    depends_on:
      - ptidss-server
    restart: unless-stopped

volumes:
  pgdata:
