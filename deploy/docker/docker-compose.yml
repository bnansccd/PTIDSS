# ============================================================
# PTIDSS 容器化部署（V2.5，可选方案）
# 三服务：postgres(18) + ptidss-server + nginx(前端静态 + 反代)
# 前置：./build.sh 产出 ptidss-server/target/*.jar 与 frontend/dist
# 使用：cd deploy/docker && docker compose up -d --build
# 数据持久化：named volume pgdata（容器删除不丢数据）
# 说明：进程级部署（deploy/scripts/*.sh）为主推方案，本编排用于
#       需要容器隔离/快速迁移的环境；TDengine 时序库不在此编排内。
# ============================================================
services:
  postgres:
    image: postgres:18
    container_name: ptidss-postgres
    environment:
      POSTGRES_DB: ptidss
      POSTGRES_USER: ptidss
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ptidss}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../docs/ddl:/docker-entrypoint-initdb.d:ro   # 首次启动自动执行 01~15
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptidss -d ptidss"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ptidss-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
    container_name: ptidss-server
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ptidss
      DB_USER: ptidss
      DB_PASSWORD: ${DB_PASSWORD:-ptidss}
      TOKEN_SECRET: ${TOKEN_SECRET:-ptidss-jwt-secret-key-2026-change-me-in-production}
      CAPTCHA_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:9080:9080"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: ptidss-nginx
    volumes:
      - ./ptidss.conf.container:/etc/nginx/conf.d/default.conf:ro
      - ../../frontend/dist:/opt/ptidss/frontend/dist:ro
    ports:
      - "80:80"
    depends_on:
      - ptidss-server
    restart: unless-stopped

volumes:
  pgdata:
